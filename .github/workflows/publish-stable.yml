name: PalaSidebar eerste Stable v2.0.0 — controleer en publiceer
on:
  push:
    branches: [main]
    paths:
      - custom_components/pala_sidebar/manifest.json
      - .github/workflows/publish-stable.yml

permissions:
  contents: write

concurrency:
  group: palasidebar-stable-v2
  cancel-in-progress: false

jobs:
  stable:
    name: Stable-controle en release vanuit geteste RC14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifieer exacte RC14-code en consistente Stable-versies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('custom_components/pala_sidebar')
          meta=json.loads((root/'manifest.json').read_text())
          v=json.loads((root/'frontend/pala-sidebar-version.json').read_text())
          src=(root/'frontend/pala-sidebar.js').read_text()
          assert meta['domain']=='pala_sidebar'
          assert meta['version']==v['version']=='2.0.0'
          assert "const VERSION = '2.0.0';" in src
          tag='v2.0.0-rc.14'
          old=subprocess.check_output(['git','ls-tree','-r','--name-only',tag,'custom_components/pala_sidebar'],text=True).splitlines()
          new=subprocess.check_output(['git','ls-files','custom_components/pala_sidebar'],text=True).splitlines()
          assert sorted(old)==sorted(new),('Bestandslijst wijkt af van RC14',set(old)^set(new))
          for path in old:
            expected=subprocess.check_output(['git','show',f'{tag}:{path}'])
            actual=Path(path).read_bytes()
            if path in ('custom_components/pala_sidebar/manifest.json','custom_components/pala_sidebar/frontend/pala-sidebar-version.json'):
              expected=expected.replace(b'2.0.0-rc.14',b'2.0.0')
            elif path.endswith('/pala-sidebar.js'):
              expected=expected.replace(b"const VERSION = '2.0.0-rc.14'",b"const VERSION = '2.0.0'")
              expected=expected.replace('PalaSidebar 2.0.0-rc7 – custom_components'.encode(),'PalaSidebar 2.0.0 – custom_components'.encode())
            assert actual==expected, f'Niet goedgekeurde bronwijziging: {path}'
          print('Stable 2.0.0 is RC14 zonder bronwijzigingen behalve versienummer.')
          PY
          python -m compileall -q custom_components/pala_sidebar
          node --check custom_components/pala_sidebar/frontend/pala-sidebar.js
          node --check custom_components/pala_sidebar/frontend/pala-sidebar-loader.js
          python tests/test_github_layout.py
          python tests/test_brand_files.py
      - name: Hassfest Home Assistant integratie
        uses: home-assistant/actions/hassfest@master
      - name: HACS-integratie valideren
        uses: hacs/action@main
        with:
          category: integration
      - name: Installeer headless Chromium voor regressietests
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          CHROME_BINARY="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$CHROME_BINARY" /usr/bin/chromium
      - name: Volledige Python- en browsertests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done
      - name: Bouw stabiel installatiepakket
        run: |
          set -euo pipefail
          mkdir -p dist/custom_components
          cp -R custom_components/pala_sidebar dist/custom_components/
          (cd dist && zip -qr ../PalaSidebar-2.0.0.zip custom_components)
          unzip -t PalaSidebar-2.0.0.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: PalaSidebar-2.0.0-gecontroleerd
          path: PalaSidebar-2.0.0.zip
          retention-days: 45
          if-no-files-found: error
      - name: Publiceer alleen eerste Stable, wijzig nooit oude tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "::error::Stable v2.0.0 bestaat al. Release nooit overschrijven."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v2.0.0" >/dev/null 2>&1; then
            echo "::error::Stable tag v2.0.0 bestaat al. Tag nooit wijzigen."
            exit 1
          fi
          gh release create v2.0.0 \
            --target "$GITHUB_SHA" \
            --title "PalaSidebar v2.0.0 — eerste Stable" \
            --notes-file docs/RELEASE-v2.0.0-STABLE.md \
            PalaSidebar-2.0.0.zip
          gh release view v2.0.0 --json tagName,isPrerelease,isDraft,url
