name: Wekelijkse PalaSidebar broncodebewaking
# Pas alerts niet automatisch als auteursrechtinbreuk aan: MIT-rechten blijven bestaan.
on:
  schedule:
    - cron: "10 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/watch-public-code.yml
      - scripts/watch_palasidebar_reuse.py
      - tests/test_public_source_monitor.py
      - tests/test_public_source_monitor_retry.py

# Laat twee controles nooit tegelijk de GitHub Code Search-limiet gebruiken.
concurrency:
  group: palasidebar-broncodebewaking
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  zoek-openbare-kopieen:
    name: Controleer openbare GitHub-code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Controleer syntax en test zoekfilter
        run: |
          python -m py_compile scripts/watch_palasidebar_reuse.py
          python tests/test_public_source_monitor.py
          python tests/test_public_source_monitor_retry.py
      # Codewijzigingen testen zonder het zoek-API-quotum te verbruiken.
      # De echte scan draait via schedule of workflow_dispatch.
      - name: Zoek herkenbare herpublicaties en meld bij dubbele match
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/watch_palasidebar_reuse.py
