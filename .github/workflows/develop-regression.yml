name: Development browser regression and test package
on:
  push:
    branches:
      - develop
      - 'fix/issue-*'
  pull_request:
    branches:
      - main
      - develop
      - rc
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROME_BINARY="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$CHROME_BINARY" /usr/bin/chromium
      - name: Execute all browser, backend and regression tests
        run: |
          set -eu
          python -m compileall -q custom_components/pala_sidebar
          for test in tests/test_*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done
      - name: Package a test installation from the checked commit
        run: |
          mkdir -p dist/custom_components
          cp -R custom_components/pala_sidebar dist/custom_components/
          cd dist
          zip -qr ../PalaSidebar-develop-test.zip custom_components
      - name: Upload developer test package
        uses: actions/upload-artifact@v4
        with:
          name: PalaSidebar-develop-test
          path: PalaSidebar-develop-test.zip
          if-no-files-found: error
          retention-days: 14
