name: Eenmalige opruiming RC1 RC2 RC3
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-old-release-candidates.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Controleer exacte versies en refs vóór verwijderen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=':' read -r ver id sha; do
            actual_tag="$(gh api "repos/$GH_REPO/releases/$id" --jq '.tag_name')"
            test "$actual_tag" = "v2.0.0-$ver" || { echo "::error::Verkeerde release bij $ver"; exit 1; }
            actual_sha="$(gh api "repos/$GH_REPO/git/ref/tags/v2.0.0-$ver" --jq '.object.sha')"
            test "$actual_sha" = "$sha" || { echo "::error::Tag is intussen gewijzigd: $ver"; exit 1; }
            echo "Bevestigd: $ver (release $id)"
          done <<'VERSIONS'
          rc1:429984718:12376cb921cc980ee2f5c7b9109ba12b6324cb5c
          rc2:430006884:505392ca7c6597a48a9dcb9049fa3b39bf96ea5f
          rc3:430129424:e610ef507227cd1f78292b6cc0454ca15461236f
          VERSIONS
          actual_branch="$(gh api "repos/$GH_REPO/branches/rc3-header-sensor-picker" --jq '.commit.sha')"
          test "$actual_branch" = "01b9aad261f72dcbc67a8dde37b5dcca11b346d7" || { echo "::error::RC3-branch is intussen gewijzigd"; exit 1; }
          echo "RC1 en RC2 hebben geen eigen branch meer. RC3-branch bevestigd."
      - name: Verwijder uitsluitend drie releases, hun tags en RC3-branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in "rc1:429984718" "rc2:430006884" "rc3:430129424"; do
            ver="${pair%%:*}"; id="${pair#*:}"
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/v2.0.0-$ver"
            echo "Verwijderd: v2.0.0-$ver (release en tag)"
          done
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/rc3-header-sensor-picker"
          echo "Verwijderd: branch rc3-header-sensor-picker"
          echo "RC4, RC5, beta-versies, develop en main zijn niet aangepast."
