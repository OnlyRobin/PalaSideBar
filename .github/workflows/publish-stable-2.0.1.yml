name: PalaSidebar v2.0.1 - gecontroleerde Stable release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/pala_sidebar/manifest.json

permissions:
  contents: write

concurrency:
  group: palasidebar-stable-2.0.1
  cancel-in-progress: false

jobs:
  audit-test-en-publiceer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inclusief onveranderlijke RC-tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exacte RC7 herkomst en Stable-versies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args])
          rc='v2.0.1-rc.7'
          git('rev-parse',rc+'^{commit}') # Never promote an untagged or unknown RC.
          root=Path('custom_components/pala_sidebar')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          front=json.loads((root/'frontend/pala-sidebar-version.json').read_text(encoding='utf-8'))
          assert manifest['version']==front['version']=='2.0.1', (manifest,front)
          assert manifest['domain']=='pala_sidebar'
          files=git('ls-tree','-r','--name-only',rc,str(root)).decode().splitlines()
          local=sorted(str(p) for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          assert sorted(files)==local, 'Integration files changed since audited RC7'
          for path in files:
              current=Path(path).read_bytes()
              previous=git('show',rc+':'+path)
              if path.endswith('pala-sidebar.js'):
                  assert previous.count(b"const VERSION = '2.0.1-rc.7';")==1
                  previous=previous.replace(b"const VERSION = '2.0.1-rc.7';",
                                            b"const VERSION = '2.0.1';")
              elif path.endswith('/manifest.json') or path.endswith('/pala-sidebar-version.json'):
                  previous=json.loads(previous.decode('utf-8'))
                  previous['version']='2.0.1'
                  assert json.loads(current.decode('utf-8'))==previous, path
                  continue
              assert current==previous, 'Unexpected change in '+path
          assert Path('docs/RELEASE-v2.0.1-STABLE.md').is_file()
          print('PASS Stable v2.0.1 matches the released RC7 byte-for-byte except three version fields.')
          PY
          python -m compileall -q custom_components/pala_sidebar
          node --check custom_components/pala_sidebar/frontend/pala-sidebar.js
          node --check custom_components/pala_sidebar/frontend/pala-sidebar-loader.js
          python tests/test_github_layout.py
          python tests/test_brand_files.py
      - name: Home Assistant Hassfest
        uses: home-assistant/actions/hassfest@master
      - name: HACS validatie
        uses: hacs/action@main
        with:
          category: integration
      - name: Chromium voor alle backend- en browsertests
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          CHROME_BINARY="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$CHROME_BINARY" /usr/bin/chromium
      - name: Complete regressiesuite op exacte Stable-commit
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done
      - name: Maak HACS herstelbaar releasepakket
        run: |
          mkdir -p dist/custom_components
          cp -R custom_components/pala_sidebar dist/custom_components/
          (cd dist && zip -qr ../PalaSidebar-2.0.1.zip custom_components)
          unzip -t PalaSidebar-2.0.1.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: PalaSidebar-2.0.1-stable-verified
          path: PalaSidebar-2.0.1.zip
          retention-days: 90
      - name: Publiceer nieuwe Stable alleen met onveranderlijke tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v2.0.1 >/dev/null 2>&1; then
            echo "::error::Stable v2.0.1 bestaat al; publiceer of overschrijf hem niet opnieuw."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v2.0.1" >/dev/null 2>&1; then
            echo "::error::Tag v2.0.1 bestaat al; bestaande tags zijn onveranderlijk."
            exit 1
          fi
          gh release view v2.0.1-rc.7 --json isPrerelease,isDraft \
            --jq 'select(.isPrerelease == true and .isDraft == false)' | grep -q .
          gh release create v2.0.1 \
            --target "$GITHUB_SHA" \
            --title "PalaSidebar v2.0.1 - Premium Stable" \
            --notes-file docs/RELEASE-v2.0.1-STABLE.md \
            --latest \
            PalaSidebar-2.0.1.zip
          gh release view v2.0.1 --json tagName,isPrerelease,isDraft,url
