name: Validate with HACS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    # HACS validation only supports public repositories.
    # Keep the repository private until source/licensing checks are complete.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
